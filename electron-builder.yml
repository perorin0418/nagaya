appId: io.github.perorin0418.nagaya
productName: nagaya
copyright: Copyright © 2026 perorin0418
directories:
  output: dist
  buildResources: build
# 入れるものだけを並べる。パターンが除外だけだと「全部」に足されてしまい、src・test などまで入るので、
# 各 OS の files でも先頭に同じものを並べる
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.{md,map,pdb,ts,cc,h,gyp,gypi}'
  - '!node_modules/node-pty/{src,deps,scripts,third_party,typings}/**'
  - '!node_modules/node-pty/build/{Makefile,config.gypi,*.mk}'
  - '!node_modules/node-pty/build/Release/{obj.target,.deps}/**'
extraResources:
  - from: rules
    to: rules
    filter: ['*.json']
# node-pty はネイティブモジュールなので asar の外に出す
asarUnpack:
  - node_modules/node-pty/**
  - resources/**
# node-pty 1.1 は Windows・macOS 向けのビルド済みバイナリ（N-API）を同梱しているので、作り直さない
npmRebuild: false
win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-x64.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  files:
    - out/**
    - resources/**
    - package.json
    # Linux でビルドした node-pty のバイナリは入れない（prebuilds/win32-x64 を使う）
    - '!node_modules/node-pty/build/**'
    - '!node_modules/node-pty/prebuilds/{darwin,linux}-*/**'
    - '!node_modules/node-pty/prebuilds/win32-arm64/**'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: nagaya
mac:
  icon: build/icon.png
  target: [dmg]
  category: public.app-category.developer-tools
  files:
    - out/**
    - resources/**
    - package.json
    - '!node_modules/node-pty/build/**'
    - '!node_modules/node-pty/prebuilds/{win32,linux}-*/**'
linux:
  icon: build/icon.png
  target: [AppImage]
  category: Development
  files:
    - out/**
    - resources/**
    - package.json
    - '!node_modules/node-pty/prebuilds/**'
